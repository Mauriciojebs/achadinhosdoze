<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Retorno seguro do Mercado Livre</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #071126; color: #eaf0ff; }
    main { width: min(560px, calc(100% - 32px)); padding: 28px; border: 1px solid #2f4d85; border-radius: 16px; background: #0d1b39; box-sizing: border-box; }
    h1 { margin: 0 0 10px; font-size: 22px; }
    p { margin: 0; line-height: 1.5; color: #b9c8eb; }
  </style>
</head>
<body>
  <main>
    <h1>Concluindo a autorização</h1>
    <p>Retornando com segurança ao Bot Afiliados...</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      if (!params.has('code') && !params.has('error')) {
        document.querySelector('p').textContent = 'Nenhum retorno de autorização foi encontrado. Volte ao painel e tente validar novamente.';
        return;
      }
      window.location.replace('http://localhost:8081/mercadolivre_oauth_callback.php' + window.location.search);
    }());
  </script>
</body>
</html>
